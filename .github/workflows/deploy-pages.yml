name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Publishable (anon) key: safe to be public, data is protected by Row Level Security.
          # Override with repository Variables of the same name if the project changes.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://kbeondyuxwqiuxyjvzfr.supabase.co' }}
          VITE_ENABLE_PHONE_AUTH: ${{ vars.VITE_ENABLE_PHONE_AUTH || 'false' }}
          VITE_ENABLE_GOOGLE_AUTH: ${{ vars.VITE_ENABLE_GOOGLE_AUTH || 'false' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'sb_publishable_3WjagfKO1qnlWq-5dq4ZJA_a6lShLrM' }}
      - name: SPA fallback (deep links like /Roomly/search)
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If Settings → Pages → Source is still "Deploy from a branch", GitHub also publishes the raw
      # source files on every push. Wait for that job to finish so this (the real app) is published last.
      - name: Wait for GitHub's branch publisher to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            if [ "$pending" = "0" ]; then echo "No branch publisher running."; break; fi
            echo "Branch publisher still running ($pending), waiting…"; sleep 10
          done
          sleep 5
      - id: deployment
        uses: actions/deploy-pages@v4
