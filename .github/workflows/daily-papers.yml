name: Daily newspaper download

on:
  schedule:
    # 11:47 and 18:47 IST — editions are usually uploaded mid-morning; the second run catches late uploads
    - cron: '17 6 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'How many latest editions to check'
        default: '5'
      dry_run:
        description: 'Dry run (discover and parse only, write nothing)'
        type: boolean
        default: false

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download latest editions and extract adverts
        run: npx tsx scripts/fetch-daily-papers.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DT_SOURCE_URLS: ${{ vars.DT_SOURCE_URLS }}
          DAYS: ${{ github.event.inputs.days || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
